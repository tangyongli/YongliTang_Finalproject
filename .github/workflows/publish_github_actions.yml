on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Linux Library Dependencies
        run: |-
          sudo apt-get update
          sudo apt install libudunits2-dev libgdal-dev libgeos-dev libproj-dev libfontconfig1-dev

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          # Match renv.lock (R 4.6.1); keeps CI aligned with local project R.
          r-version: '4.6.1'

      - name: Install R Dependencies
        uses: r-lib/actions/setup-renv@v2
        with:
          # Bump when lockfile/R major targets change so caches do not mix.
          cache-version: 2

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
